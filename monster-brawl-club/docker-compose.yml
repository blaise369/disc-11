# One command to play locally:  docker compose up --build   then open http://localhost:3001
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mbc
      POSTGRES_PASSWORD: mbc
      POSTGRES_DB: mbc
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbc"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
  game:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://mbc:mbc@db:5432/mbc
      REDIS_URL: redis://redis:6379
      # Plain http://localhost: secure cookies would be dropped by some browsers.
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
volumes:
  db-data:
